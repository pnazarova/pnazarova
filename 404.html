<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found | Gregory La Blanc</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="/assets/favicon.png" sizes="96x96">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style>
        /* Same tokens as styles.css so this page cannot drift from the site again. */
        :root {
            --paper: #fbf6ea;
            --ink: #14264d;
            --ink-soft: #4a5677;
            --navy: #0e2350;
            --navy-deep: #0a1d3d;
            --gold: #b8860b;
            --sketch: 255px 12px 225px 18px / 18px 225px 12px 255px;
            --font-display: "Bricolage Grotesque", "Arial Black", sans-serif;
            --font-body: "Instrument Sans", system-ui, -apple-system, sans-serif;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem;
            text-align: center;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: 1.0625rem;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: clamp(2.1rem, 6vw, 3.6rem);
            line-height: 1.1;
            letter-spacing: -0.01em;
            margin-bottom: 0.75rem;
        }

        h1 em {
            font-style: italic;
            color: var(--gold);
        }

        p { color: var(--ink-soft); }

        .btn {
            display: inline-flex;
            align-items: center;
            margin-top: 1.75rem;
            padding: 0.9rem 1.75rem;
            font-family: var(--font-body);
            font-size: 0.9375rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            text-decoration: none;
            background: var(--navy);
            color: #fff;
            border: 2px solid var(--ink);
            border-radius: var(--sketch);
            box-shadow: 3px 3px 0 rgba(10, 33, 74, 0.25);
            transition: transform 0.25s var(--ease), background 0.25s, box-shadow 0.25s;
        }

        .btn:hover {
            background: var(--navy-deep);
            transform: translate(-1px, -2px) rotate(-0.5deg);
            box-shadow: 5px 5px 0 rgba(10, 33, 74, 0.3);
        }

        @media (prefers-reduced-motion: reduce) {
            .btn { transition: none; }
            .btn:hover { transform: none; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Lost in the <em>silos?</em></h1>
        <p>This page doesn't exist, but Greg's site does.</p>
        <a class="btn" href="/">Back to glablanc.com</a>
    </main>
</body>
</html>
